<script>
const G={"sp": "<!DOCTYPE html>\n<html lang=\"tr\"><head><meta charset=\"utf-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1, viewport-fit=cover\">\n<title>[[Big Shot]] – Spamton NEO Dövüşü<\/title>\n<style>\n:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}\nhtml,body{margin:0;height:100%;background:#000;overflow:hidden;touch-action:none;-webkit-user-select:none;user-select:none}\nbody{display:flex;align-items:center;justify-content:center}\ncanvas{width:100%;max-width:calc((100vh - 20px)*4/3);aspect-ratio:4/3;image-rendering:pixelated;background:#000;touch-action:none}\n<\/style><\/head><body>\n<canvas id=\"c\" width=\"640\" height=\"480\"><\/canvas>\n<script>\nconst C=document.getElementById('c'),X=C.getContext('2d'),W=640,H=480;\nconst BOX={x:200,y:262,w:240,h:130};\nconst FONT='bold 20px \"Courier New\",monospace';\nlet S='menu',sel=0,sub=null,hp=90,MAXHP=90,tp=0,eh=6000,EMAX=6000,turn=0,items=1,t=0,\n msg='* SPAMTON NEO belirdi! Teller sallanıyor.',mi=0,talk='',timer=0,\n soul={x:320,y:330},inv=0,bul=[],sp=0,flash=0,dmgTxt=null,bar=0,barDir=1,hitDone=false,spamAngry=0,mercyOK=false,keys={};\nconst acts=['Kontrol Et','Pazarlık Et','Telleri Kes'];\nconst taunts=[\"HEY [[Çocuk]]! [[Big Shot]] OLMAK İSTER MİSİN?!\",\"[[İNDİRİM]] [[İNDİRİM]] SADECE BUGÜN!!\",\"SENİN [[KROMER]]İN NEREDE?!\",\"[[PİPİS]] YAĞMURU!!\",\"BENİ [[KANCADAN]] KURTAR!!\",\"HAHAHA! [[HEART]] BENİM OLACAK!\",\"[[ÖZEL]] FIRSAT!! 1 [[ÇOCUK]] ALANA 1 BEDAVA!\"];\nfunction say(m){msg=m;mi=0}\nconst btn=['DÖVÜŞ','EYLEM','EŞYA','MERHAMET'];\nfunction bx(i){return{x:14+i*156,y:418,w:146,h:52}}\n// ---------- input ----------\nlet ptr=null;\nfunction pos(e){const r=C.getBoundingClientRect();return{x:(e.clientX-r.left)*W/r.width,y:(e.clientY-r.top)*H/r.height}}\nconst ptrs={};\nlet chg=0;function bigShot(){if(S==='attack'||S==='talk')pb.push({x:soul.x,y:soul.y-20,big:1})}\nlet mine=false;const JB={x:90,y:444,r:30};let jv={x:0,y:0};\nfunction joy(p){const dx=p.x-JB.x,dy=p.y-JB.y,d=Math.hypot(dx,dy)||1,m=Math.min(d,JB.r*1.4)/(JB.r*1.4);jv={x:dx/d*m,y:dy/d*m}}\nC.addEventListener('pointerdown',e=>{C.setPointerCapture(e.pointerId);const p=pos(e);if((S==='attack'||S==='talk')&&p.y>400){if(p.x<300){ptrs[e.pointerId]='joy';joy(p)}else{ptrs[e.pointerId]='fire';shoot()}return}ptrs[e.pointerId]=p;tap(p)});\nC.addEventListener('pointermove',e=>{if(ptrs[e.pointerId]==='joy')joy(pos(e))});\nC.addEventListener('pointerup',e=>{if(ptrs[e.pointerId]==='joy')jv={x:0,y:0};delete ptrs[e.pointerId]});\nC.addEventListener('pointercancel',e=>{if(ptrs[e.pointerId]==='joy')jv={x:0,y:0};delete ptrs[e.pointerId]});\n// ---- ruh atışları (Big Shot) ----\nlet pb=[],shootCd=0;\nfunction shoot(){if((S!=='attack'&&S!=='talk')||shootCd>0)return;shootCd=.22;pb.push({x:soul.x,y:soul.y-12})}\nfunction upPB(dt){\n shootCd-=dt;if(S!=='attack'&&S!=='talk')chg=0;else if(Object.values(ptrs).includes('fire')||keys[' ']||keys.z||keys.Z)chg+=dt;else{if(chg>=.8)bigShot();chg=0}\n for(const s of pb){s.y-=520*dt;\n  const bw=s.big?95:70;if(!s.dead&&s.y<200&&s.y>55&&Math.abs(s.x-320)<bw){s.dead=1;const d=s.big?(mine?200:130):(mine?30:18);eh=Math.max(0,eh-d);flash=.15;tp=Math.min(100,tp+1);dmgTxt={v:d,t:.4};if(eh<=0)S='win'}}\n pb=pb.filter(s=>!s.dead&&s.y>-20);\n}\naddEventListener('keydown',e=>{const _m={w:'ArrowUp',a:'ArrowLeft',s:'ArrowDown',d:'ArrowRight',W:'ArrowUp',A:'ArrowLeft',S:'ArrowDown',D:'ArrowRight'}[e.key];if(_m)e=new Proxy(e,{get:(o,p)=>p==='key'?_m:(typeof o[p]==='function'?o[p].bind(o):o[p])});keys[e.key]=1;if(['z','Z','Enter',' '].includes(e.key))tap(null,'ok');if(['x','X'].includes(e.key))tap(null,'back');\n if(S==='menu'&&!sub){if(e.key==='ArrowRight')sel=(sel+1)%4;if(e.key==='ArrowLeft')sel=(sel+3)%4}\n else if(S==='menu'&&sub){if(e.key==='ArrowDown')sub.i=(sub.i+1)%sub.l.length;if(e.key==='ArrowUp')sub.i=(sub.i+sub.l.length-1)%sub.l.length}});\naddEventListener('keyup',e=>{const _m={w:'ArrowUp',a:'ArrowLeft',s:'ArrowDown',d:'ArrowRight',W:'ArrowUp',A:'ArrowLeft',S:'ArrowDown',D:'ArrowRight'}[e.key];keys[_m||e.key]=0});\nfunction inR(p,r){return p.x>=r.x&&p.x<=r.x+r.w&&p.y>=r.y&&p.y<=r.y+r.h}\nfunction tap(p,k){\n if(S==='over'||S==='win'){if(p||k)reset();return}\n if(S==='menu'&&!sub){\n  if(p){for(let i=0;i<4;i++)if(inR(p,bx(i))){sel=i;choose();return}}\n  else if(k==='ok')choose();\n }else if(S==='menu'&&sub){\n  if(k==='back'){sub=null;return}\n  if(p){if(p.y>400){sub=null;return}\n   for(let i=0;i<sub.l.length;i++)if(p.x>230&&p.x<560&&p.y>262+i*34&&p.y<296+i*34){sub.i=i;pick();return}}\n  else if(k==='ok')pick();\n }else if(S==='fight'){strike()}\n else if(S==='attack'&&k==='ok'){shoot()}\n else if(S==='text'&&(p||k==='ok')){if(mi<msg.length)mi=msg.length;else if(pend){pend=false;startTurn()}else{S='menu'}}\n}\nfunction choose(){\n if(sel===0){mine=true;S='attack';timer=6;bul=[];pb=[];soul.x=BOX.x+BOX.w/2;soul.y=BOX.y+BOX.h-20;say('')}\n else if(sel===1)sub={t:'act',l:acts,i:0};\n else if(sel===2)sub={t:'item',l:['Kuru Ekmek x'+items+' (+40 HP)'],i:0};\n else sub={t:'mercy',l:['Merhamet','Kaç'],i:0};\n}\nfunction pick(){\n const s=sub;sub=null;\n if(s.t==='act'){\n  if(s.i===0)say('* SPAMTON NEO - SALDIRI 99 SAVUNMA 0\\n* Tellerle asılı. Parıltılı. Pahalı.'),endText();\n  if(s.i===1){say('* Pazarlık ettin! \"[[İNDİRİM]]\" diye bağırıyor.\\n* Biraz sakinleşti (TP +20).');tp=Math.min(100,tp+20);endText()}\n  if(s.i===2){if(tp>=30){tp-=30;hurt(350);say('* Telleri kestin! SPAMTON NEO acıyla çığlık attı!');endText()}else{say('* TP yetmiyor (30 gerek). Pazarlık yap!');S='text';return}}\n }else if(s.t==='item'){\n  if(items>0){items--;hp=Math.min(MAXHP,hp+40);say('* Kuru Ekmek yedin. HP +40!');endText()}else{say('* Hiç eşya kalmadı.');S='text'}\n }else{\n  if(s.i===0){if(eh<EMAX*0.3){S='win';return}say('* Merhamet etmek istedin ama SPAMTON NEO henüz\\n  yeterince yorulmadı. (HP %30 altı olmalı)');endText()}\n  else{say('* Kaçmaya çalıştın... Teller seni geri çekti!');endText()}\n }\n}\nfunction endText(){S='text';textNext=true;pend=true}\nlet textNext=false,pend=false;\nfunction strike(){\n if(hitDone)return;hitDone=true;\n const q=Math.max(0,1-Math.abs(bar-0.5)*2);\n const d=Math.round(100+q*420);hurt(d);tp=Math.min(100,tp+Math.round(q*25));\n say('* '+d+' hasar verdin!');\n setTimeout(()=>{S='text'},650);\n}\nfunction hurt(d){eh=Math.max(0,eh-d);flash=0.5;dmgTxt={v:d,t:1};if(eh<=0)setTimeout(()=>S='win',700)}\nfunction startTurn(){\n S='talk';pend=false;talk=taunts[(Math.random()*taunts.length)|0];mi=0;timer=2.2;bul=[];pb=[];sp=0;soul.x=BOX.x+BOX.w/2;soul.y=BOX.y+BOX.h/2;pat=turn%5;turn++;\n if(eh<EMAX*.3)talk='[[SON]] [[İNDİRİM]]!! HEPSİNİ AL!!'\n}\nlet pat=0;\nfunction reset(){try{parent.postMessage({s:'reset'},'*')}catch(e){}}\n// ---------- bullets ----------\nfunction spawn(dt){\n sp-=dt;if(sp>0)return;\n const bx0=BOX.x,bx1=BOX.x+BOX.w;\n if(pat===0){sp=.14;bul.push({k:'pip',x:bx0+Math.random()*BOX.w,y:BOX.y-10,vx:0,vy:210+Math.random()*80,r:8,ph:Math.random()*6})}\n else if(pat===1){sp=.55;const y=BOX.y+20+Math.random()*(BOX.h-40);bul.push({k:'laser',y,h:22,w:0,t:0,f:.45,life:.3});if(Math.random()<.5)bul.push({k:'laser',y:BOX.y+20+Math.random()*(BOX.h-40),h:22,w:0,t:0,f:.55,life:.3})}\n else if(pat===2){sp=.6;const x=bx0+Math.random()*BOX.w;bul.push({k:'string',x,t:0,f:.6,life:.4})}\n else if(pat===3){sp=.35;const a=Math.atan2(soul.y-60,soul.x-320);bul.push({k:'head',x:320,y:90,vx:Math.cos(a)*250,vy:Math.sin(a)*250,r:9})}\n else{sp=.2;const side=Math.random()<.5;bul.push({k:'heart',x:side?bx0-10:bx1+10,y:BOX.y+Math.random()*BOX.h,vx:side?180:-180,vy:0,r:8,ph:0})}\n}\nfunction upBul(dt){\n for(const b of bul){\n  if(b.k==='laser'||b.k==='string'){b.t+=dt;if(b.t>b.f)b.life-=dt;continue}\n  b.x+=b.vx*dt;b.y+=b.vy*dt;\n  if(b.k==='pip'){b.ph+=dt*4;b.x+=Math.sin(b.ph)*40*dt}\n  if(b.k==='heart'){b.ph+=dt*5;b.y+=Math.sin(b.ph)*90*dt}\n }\n bul=bul.filter(b=>b.life===undefined?(b.y<H&&b.y>-40&&b.x>-40&&b.x<W+40):b.life>0);\n}\nfunction collide(){\n if(inv>0)return;\n for(const b of bul){\n  let h=false;\n  if(b.r){h=Math.hypot(b.x-soul.x,b.y-soul.y)<b.r+4}\n  else if(b.t>b.f){\n   if(b.k==='laser')h=Math.abs(soul.y-b.y)<b.h/2+3;\n   else h=Math.abs(soul.x-b.x)<10+3}\n  if(h){hp-=12;inv=.8;tp=Math.min(100,tp+4);if(hp<=0){hp=0;S='over'}break}\n }\n}\n// ---------- loop ----------\nlet last=performance.now();\nfunction loop(n){const dt=Math.min(.05,(n-last)/1000);last=n;t+=dt;update(dt);draw();requestAnimationFrame(loop)}\nlet _ls='';function update(dt){if(S!==_ls){_ls=S;try{parent.postMessage({s:S},'*')}catch(e){}}\n if(mi<msg.length)mi+=dt*45;\n if(flash>0)flash-=dt;if(dmgTxt){dmgTxt.t-=dt;if(dmgTxt.t<=0)dmgTxt=null}\n if(inv>0)inv-=dt;\n if(S==='text'&&mi>=msg.length&&textNext){textNext=false;setTimeout(()=>{if(S==='text')startTurn()},700)}\n if(S==='fight'&&!hitDone){bar+=barDir*dt*1.1;if(bar>=1){bar=1;barDir=-1}if(bar<=0){bar=0;barDir=1}}\n if(S==='talk'){timer-=dt;upPB(dt);if(timer<=0){S='attack';timer=7.5}}\n if(S==='attack'){\n  const v=170*dt;soul.x+=jv.x*190*dt;soul.y+=jv.y*190*dt;\n  if(keys.ArrowLeft)soul.x-=v;if(keys.ArrowRight)soul.x+=v;if(keys.ArrowUp)soul.y-=v;if(keys.ArrowDown)soul.y+=v;\n  soul.x=Math.max(BOX.x+8,Math.min(BOX.x+BOX.w-8,soul.x));soul.y=Math.max(BOX.y+8,Math.min(BOX.y+BOX.h-8,soul.y));\n  if(!mine)spawn(dt);upBul(dt);upPB(dt);collide();timer-=dt;\n  if(timer<=0&&S==='attack'&&mine){mine=false;startTurn()}else if(timer<=0&&S==='attack'){S='menu';say('* SPAMTON NEO teller üzerinde sallanıyor.');bul=[]}\n }\n}\n// ---------- drawing ----------\nfunction poly(pts,fill,stroke){X.beginPath();pts.forEach((p,i)=>i?X.lineTo(p[0],p[1]):X.moveTo(p[0],p[1]));X.closePath();if(fill){X.fillStyle=fill;X.fill()}if(stroke){X.strokeStyle=stroke;X.lineWidth=2;X.stroke()}}\nfunction spamton(){\n const cx=320,cy=130+Math.sin(t*2)*7,sh=flash>0?(Math.random()-.5)*10:0,x0=cx+sh;\n // teller\n X.strokeStyle='#f6a';X.lineWidth=2;\n [[-90,-90],[-60,-90],[60,-90],[90,-90],[-20,  cur=k;story=!!st;fromIsl=!!fi;document.getElementById('mbtn').style.display='block';panel.style.display='none';menu.style.display='none';gm.style.display='block';
 if(fr)fr.remove();fr=document.createElement('iframe');fr.srcdoc=G[k];fr.onload=()=>{try{fr.contentWindow.focus()}catch(e){}};gm.insertBefore(fr,gm.firstChild);
}
function launchIsland(){
 cur='is';story=false;fromIsl=false;document.getElementById('mbtn').style.display='none';panel.style.display='none';menu.style.display='none';gm.style.display='block';
 if(fr)fr.remove();fr=document.createElement('iframe');fr.srcdoc=G.is;fr.onload=()=>{try{fr.contentWindow.focus();fr.contentWindow.postMessage({beaten,pos:islPos,shells:islShells},'*')}catch(e){}};gm.insertBefore(fr,gm.firstChild);
}
function back(){if(fromIsl&&cur!=='is')launchIsland();else toMenu()}
function toMenu(){fromIsl=false;if(fr){fr.remove();fr=null}panel.style.display='none';gm.style.display='none';menu.style.display='flex';renderMenu()}
document.getElementById('mbtn').onclick=back;
function showPanel(t){
 const nx=order[order.indexOf(cur)+1];let h='';
 if(t==='win'){
  h='<div class="t">★ '+names[cur]+' YENİLDİ! ★</div>'+(newUn?'<div class="t" style="color:#f66">GİZLİ BOSS AÇILDI: ROARING JEVIL NEO!</div>':'')+(newDm?'<div class="t" style="color:#4cf">SON BOSS AÇILDI: DAMACANA!</div>':'')+'<div class="row">';newUn=false;newDm=false;
  if(story&&nx&&(nx!=='rj'||unlocked())&&(nx!=='dm'||beaten.rj))h+='<button data-a="next">SONRAKİ: '+names[nx]+' ▶</button>';
  else if(story)h+='<div class="t" style="color:#ff0">TEBRİKLER! HEPSİNİ YENDİN</div>';
  h+='<button data-a="retry">TEKRAR</button><button data-a="menu">'+(fromIsl?'ADAYA DÖN':'MENÜ')+'</button></div>';
 }else h='<div class="t" style="color:#f55">OYUN BİTTİ</div><div class="row"><button data-a="retry">TEKRAR DENE</button><button data-a="menu">'+(fromIsl?'ADAYA DÖN':'MENÜ')+'</button></div>';
 panel.innerHTML=h;panel.style.display='flex';
}
panel.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;const a=b.dataset.a;
 if(a==='next')launch(order[order.indexOf(cur)+1],true);else if(a==='retry')launch(cur,story,fromIsl);else if(a==='menu')back()});
addEventListener('message',e=>{
 if(!fr||e.source!==fr.contentWindow||!e.data)return;const d=e.data;if(d.pos)islPos=d.pos;if(d.shells)islShells=d.shells;if(d.go){launch(d.go,false,true);return}const s=d.s;if(!s)return;
 if(s==='win'){const was=unlocked(),wasR=!!beaten.rj;beaten[cur]=1;save();if(!was&&unlocked())newUn=true;if(cur==='rj'&&!wasR)newDm=true;setTimeout(()=>showPanel('win'),900)}
 else if(s==='over')setTimeout(()=>showPanel('over'),900);
});
(function(){
 const intro=document.getElementById('intro'),ic=document.getElementById('ic'),c=ic.getContext('2d'),pl=document.getElementById('play');
 const img=new Image();let T0=0,off=0,done=false,words=[],shards=[],cracks=[];
 const clamp=(v,a,b)=>Math.max(a,Math.min(b,v)),ease=p=>1-Math.pow(1-p,3);
 img.onload=()=>{build();T0=performance.now();requestAnimationFrame(frame)};img.src=LOGO;
 function build(){
  const k=img.naturalWidth/1254,Y0=698*k,Y1=936*k;
  [[40,592,0],[588,1150,1]].forEach(([a,b,side])=>{
   const sx=a*k,w=Math.round((b-a)*k),h=Math.round(Y1-Y0),oc=document.createElement('canvas');oc.width=w;oc.height=h;
   const o=oc.getContext('2d');o.drawImage(img,sx,Y0,w,h,0,0,w,h);
   const d=o.getImageData(0,0,w,h),p=d.data;
   for(let i=0;i<p.length;i+=4){const r=p[i],g=p[i+1],bl=p[i+2];const ok=side?(r>180&&g<125&&bl<150&&r-g>90):(r>165&&g>140&&bl>165);p[i+3]=ok?255:0}
   o.putImageData(d,0,0);words.push({oc,x:sx,y:Y0,w,h,side});
   const S=12;
   for(let ty=0;ty<h;ty+=S)for(let tx=0;tx<w;tx+=S){const tw=Math.min(S,w-tx),th=Math.min(S,h-ty),dd=o.getImageData(tx,ty,tw,th).data;let any=0;for(let i=3;i<dd.length;i+=4)if(dd[i]){any=1;break}if(!any)continue;
    const cx=sx+tx+S/2,cy=Y0+ty+S/2,ang=Math.atan2(cy-(Y0+Y1)/2,cx-592*k)+(Math.random()-.5)*.9,sp=140+Math.random()*320;
    shards.push({oc,tx,ty,tw,th,hx:sx+tx,hy:Y0+ty,vx:Math.cos(ang)*sp,vy:Math.sin(ang)*sp-60,rot:(Math.random()-.5)*14,fo:Math.random()*10})}
  });
  for(let i=0;i<4;i++){const pts=[];let y=Y0-10;while(y<Y1+10){pts.push([592*k+(Math.random()-.5)*26,y]);y+=14+Math.random()*10}cracks.push(pts)}
 }
 function frame(now){
  const W=innerWidth,H=innerHeight,dpr=Math.min(devicePixelRatio||1,2);
  if(ic.width!==Math.round(W*dpr)||ic.height!==Math.round(H*dpr)){ic.width=Math.round(W*dpr);ic.height=Math.round(H*dpr)}
  c.setTransform(dpr,0,0,dpr,0,0);c.clearRect(0,0,W,H);
  const t=(now-T0)/1000+off,k=img.naturalWidth/1254,x0u=40*k,x1u=1150*k,Y0u=698*k,Y1u=936*k,cx0=(x0u+x1u)/2,cy0=(Y0u+Y1u)/2;
  const sc=Math.min(W*.92/(x1u-x0u),H*.3/(Y1u-Y0u)),X=u=>W/2+(u-cx0)*sc,Yf=u=>H*.42+(u-cy0)*sc;
  const slide=(offU,glow)=>{words.forEach(w=>{c.shadowColor=w.side?'#ff2040':'#c8a0ff';c.shadowBlur=glow;c.drawImage(w.oc,X(w.x+(w.side?offU:-offU)),Yf(w.y),w.w*sc,w.h*sc)});c.shadowBlur=0};
  c.save();
  if(t>1.5&&t<1.85)c.translate((Math.random()-.5)*10,(Math.random()-.5)*10);
  if(t>=.4&&t<1.95){const e=Math.pow(clamp((t-.4)/1.1,0,1),3);slide((W*.6/sc)*(1-e),16)}
  if(t>=1.5&&t<2.1){c.strokeStyle='#fff';c.lineWidth=3;c.shadowColor='#fff';c.shadowBlur=10;cracks.forEach(pts=>{c.beginPath();pts.forEach((p,i)=>i?c.lineTo(X(p[0]),Yf(p[1])):c.moveTo(X(p[0]),Yf(p[1])));c.stroke()});c.shadowBlur=0}
  if(t>=1.95&&t<3.9){
   const dt=t-1.95,fl=clamp(1-(t-3.4)/.5,0,1),floorU=(H*.88-H*.42)/sc+cy0;
   c.globalAlpha=fl;
   shards.forEach(s=>{const px=s.hx+s.vx*Math.min(dt,.9);let py=s.hy+s.vy*dt+450*dt*dt;const ym=floorU-s.th-s.fo;let r=s.rot*Math.min(dt,1.2);if(py>ym){py=ym}
    c.save();c.translate(X(px+s.tw/2),Yf(py+s.th/2));c.rotate(r);c.drawImage(s.oc,s.tx,s.ty,s.tw,s.th,-s.tw*sc/2,-s.th*sc/2,s.tw*sc,s.th*sc);c.restore()});
   c.globalAlpha=1}
  if(t>=3.9&&t<4.7){const p=ease(clamp((t-3.9)/.8,0,1));slide((W*.6/sc)*(1-p),16)}
  if(t>=4.7)slide(0,16+Math.max(0,1-(t-4.7)/.4)*24);
  const a2=clamp((t-5.0)/.9,0,1);
  if(a2>0){const fs=(Y1u-Y0u)*sc*.5,ty=H*.42+(Y1u-cy0)*sc+fs*1.3;c.save();c.globalAlpha=a2;c.translate(W/2,ty);const s2=1+(1-a2)*.35;c.scale(s2,s2);
   c.font='italic 900 '+fs+'px Impact,"Arial Black",sans-serif';const sp=fs*.18,gap=fs*.5;
   const wd=s=>{let w=0;for(const ch of s)w+=c.measureText(ch).width+sp;return w};
   let x=-(wd('BOSS')+gap+wd('RUSH'))/2;
   const dr=(s,col,gl)=>{c.fillStyle=col;c.shadowColor=gl;c.shadowBlur=18;c.strokeStyle='#000';c.lineWidth=fs*.08;for(const ch of s){c.strokeText(ch,x,0);c.fillText(ch,x,0);x+=c.measureText(ch).width+sp}};
   dr('BOSS','#fff','#b46bff');x+=gap;dr('RUSH','#ff2a4a','#ff2a4a');c.restore()}
  c.restore();
  if(t>1.5&&t<1.8){c.fillStyle='rgba(255,255,255,'+(.8*(1-(t-1.5)/.3))+')';c.fillRect(0,0,W,H)}
  if(t>=6.2&&!pl.classList.contains('on')){pl.style.opacity=1;pl.style.pointerEvents='auto';pl.classList.add('on')}
  if(!done)requestAnimationFrame(frame)
 }
 function start(){if(done)return;done=true;intro.style.opacity=0;setTimeout(()=>{intro.remove();launchIsland()},500)}
 function skip(){const t=(performance.now()-T0)/1000+off;if(t<6.2)off+=6.2-t}
 pl.onclick=start;
 intro.addEventListener('pointerdown',e=>{if(e.target!==pl)skip()});
 addEventListener('keydown',e=>{if(done)return;if(pl.classList.contains('on')){if(e.key==='Enter'||e.key===' ')start()}else skip()});
})();
</script></body></html>
